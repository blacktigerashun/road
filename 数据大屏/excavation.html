<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>历年遗址发掘数量统计详情</title>
  <script src="js/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      color: #fff;
      font-family: sans-serif;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      position: relative;
      padding: 15px;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('../丝绸之路/img/背景2.png') no-repeat center/cover;
      background-attachment: fixed;
      z-index: -1;
      filter: brightness(0.8);
    }

    /* 头部样式 */
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #FFD700;
      margin-bottom: 12px;
    }

    .head h2 {
      font-size: 24px;
      font-family: sans-serif;
      background: linear-gradient(135deg, #FFD700, #FFB800, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
    }

    .back {
      color: #FFD700;
      cursor: pointer;
      font-size: 14px;
      background: rgba(139, 69, 19, 0.7);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      transition: all 0.3s ease;
    }

    .back:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    /* 网格布局 - 2行3列 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: calc(100% - 80px);
    }

    /* 模块样式 - 古建筑风格边框+背景 */
    .box {
      background: rgba(139, 69, 19, 0.8);
      border: 1px solid #FFD700;
      border-radius: 8px;
      padding: 15px;
      position: relative;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .box::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      border: 1px solid rgba(255, 215, 0, 0.1);
      border-radius: 6px;
      pointer-events: none;
    }

    /* 标题样式 */
    .title {
      font-size: 15px;
      color: #FFD700;
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 3px solid #FFD700;
      font-family: sans-serif;
    }

    /* 图表容器 */
    .chart {
      height: calc(100% - 30px);
      width: 100%;
    }

    /* 数据卡片 */
    .info-card {
      grid-column: 1/2;
      grid-row: 1/2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      font-size: 14px;
    }

    .info-label {
      color: #FFE4B5;
      width: 100px;
    }

    .info-value {
      color: #FFD700;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="head">
    <h2>历年遗址发掘数量统计详情</h2>
    <div class="back" onclick="location.href='index.html'">← 返回大屏</div>
  </div>

  <div class="grid">
    <!-- 1. 基础信息卡片 -->
    <div class="box info-card">
      <div class="title">发掘统计概览</div>
      <div class="info-item"><span class="info-label">近十年总数</span><span class="info-value">1196 处</span></div>
      <div class="info-item"><span class="info-label">年均发掘</span><span class="info-value">119.6 处</span></div>
      <div class="info-item"><span class="info-label">最高年份</span><span class="info-value">2025年 (286处)</span></div>
      <div class="info-item"><span class="info-label">增长率</span><span class="info-value">12.8%</span></div>
      <div class="info-item"><span class="info-label">发掘完整率</span><span class="info-value">42.3%</span></div>
    </div>

    <!-- 2. 历年发掘数量趋势图 -->
    <div class="box">
      <div class="title">历年发掘数量趋势</div>
      <div class="chart" id="c1"></div>
    </div>

    <!-- 3. 发掘类型分布 -->
    <div class="box">
      <div class="title">发掘类型分布</div>
      <div class="chart" id="c2"></div>
    </div>

    <!-- 4. 发掘效率分析 -->
    <div class="box">
      <div class="title">发掘效率分析</div>
      <div class="chart" id="c3"></div>
    </div>

    <!-- 5. 发掘与修复对比 -->
    <div class="box">
      <div class="title">发掘与修复对比</div>
      <div class="chart" id="c4"></div>
    </div>

    <!-- 6. 未来发掘预测 -->
    <div class="box">
      <div class="title">未来发掘预测</div>
      <div class="chart" id="c5"></div>
    </div>
  </div>

  <script>
    // 1. 历年发掘数量趋势图
    echarts.init(document.getElementById('c1')).setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '10%', right: '5%', top: '15%', bottom: '15%' },
      xAxis: {
        type: 'category', 
        data: ['2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025'],
        axisLine: { lineStyle: { color: '#FFD700' } },
        axisLabel: { color: '#FFE4B5' }
      },
      yAxis: {
        type: 'value', 
        name: '发掘数量', 
        nameTextStyle: { color: '#FFE4B5' },
        axisLine: { lineStyle: { color: '#FFD700' } },
        axisLabel: { color: '#FFE4B5' }
      },
      series: [
        {
          name: '发掘数量', 
          type: 'line', 
          smooth: true,
          data: [126, 132, 145, 158, 189, 195, 203, 218, 247, 265, 286],
          lineStyle: { color: '#3b82f6', width: 3 },
          itemStyle: { color: '#3b82f6' },
          symbol: 'circle', 
          symbolSize: 6,
          areaStyle: { color: 'rgba(59, 130, 246, 0.1)' }
        },
        {
          name: '皇宫类', 
          type: 'line', 
          smooth: true,
          data: [8, 12, 15, 18, 22, 25, 28, 32, 35, 40, 45],
          lineStyle: { color: '#10b981', width: 2 },
          itemStyle: { color: '#10b981' },
          symbol: 'circle', 
          symbolSize: 5
        },
        {
          name: '官府类', 
          type: 'line', 
          smooth: true,
          data: [35, 42, 48, 55, 62, 70, 78, 85, 95, 105, 115],
          lineStyle: { color: '#8b5cf6', width: 2 },
          itemStyle: { color: '#8b5cf6' },
          symbol: 'circle', 
          symbolSize: 5
        },
        {
          name: '桥梁类', 
          type: 'line', 
          smooth: true,
          data: [15, 18, 22, 25, 28, 32, 35, 40, 45, 50, 55],
          lineStyle: { color: '#ec4899', width: 2 },
          itemStyle: { color: '#ec4899' },
          symbol: 'circle', 
          symbolSize: 5
        },
        {
          name: '民居类', 
          type: 'line', 
          smooth: true,
          data: [68, 60, 60, 60, 77, 68, 62, 61, 72, 70, 71],
          lineStyle: { color: '#06b6d4', width: 2 },
          itemStyle: { color: '#06b6d4' },
          symbol: 'circle', 
          symbolSize: 5
        }
      ]
    });

    // 2. 发掘类型分布
    echarts.init(document.getElementById('c2')).setOption({
      tooltip: { trigger: 'item' },
      legend: {
        orient: 'vertical', 
        right: '5%', 
        top: 'center',
        textStyle: { color: '#FFE4B5' }
      },
      series: [
        {
          name: '发掘类型', 
          type: 'pie', 
          radius: ['30%', '60%'],
          center: ['40%', '50%'],
          data: [
            { value: 128, name: '皇宫' },
            { value: 432, name: '官府' },
            { value: 278, name: '桥梁' },
            { value: 1365, name: '民居' }
          ],
          itemStyle: {
            color: function (params) {
              var colorList = ['#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
              return colorList[params.dataIndex];
            }
          },
          label: { show: true, position: 'inside', color: '#fff' }
        }
      ]
    });

    // 3. 发掘效率分析
    echarts.init(document.getElementById('c3')).setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '10%', right: '5%', top: '15%', bottom: '15%' },
      xAxis: {
        type: 'category', 
        data: ['2015', '2017', '2019', '2021', '2023', '2025'],
        axisLine: { lineStyle: { color: '#FFD700' } },
        axisLabel: { color: '#FFE4B5' }
      },
      yAxis: [
        {
          type: 'value', 
          name: '发掘数量', 
          nameTextStyle: { color: '#FFE4B5' },
          axisLine: { lineStyle: { color: '#FFD700' } },
          axisLabel: { color: '#FFE4B5' }
        },
        {
          type: 'value', 
          name: '投入资金(百万元)', 
          nameTextStyle: { color: '#FFB800' },
          axisLine: { lineStyle: { color: '#FFB800' } },
          axisLabel: { color: '#FFB800' }
        }
      ],
      series: [
        {
          name: '发掘数量', 
          type: 'bar', 
          data: [126, 145, 189, 203, 247, 286],
          itemStyle: { color: '#3b82f6' }
        },
        {
          name: '投入资金', 
          type: 'line', 
          yAxisIndex: 1,
          data: [35, 48, 65, 82, 98, 125],
          lineStyle: { color: '#10b981', width: 3 },
          itemStyle: { color: '#10b981' }
        }
      ]
    });

    // 4. 发掘与修复对比
    echarts.init(document.getElementById('c4')).setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '10%', right: '5%', top: '15%', bottom: '15%' },
      xAxis: {
        type: 'category', 
        data: ['2015', '2017', '2019', '2021', '2023', '2025'],
        axisLine: { lineStyle: { color: '#FFD700' } },
        axisLabel: { color: '#FFE4B5' }
      },
      yAxis: {
        type: 'value', 
        name: '数量', 
        nameTextStyle: { color: '#FFE4B5' },
        axisLine: { lineStyle: { color: '#FFD700' } },
        axisLabel: { color: '#FFE4B5' }
      },
      series: [
        {
          name: '发掘数量', 
          type: 'bar', 
          barWidth: 20,
          data: [126, 145, 189, 203, 247, 286],
          itemStyle: { color: '#3b82f6' }
        },
        {
          name: '修复数量', 
          type: 'bar', 
          barWidth: 20,
          data: [89, 112, 145, 168, 198, 225],
          itemStyle: { color: '#8b5cf6' }
        }
      ]
    });

    // 5. 未来发掘预测
    echarts.init(document.getElementById('c5')).setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '10%', right: '5%', top: '15%', bottom: '15%' },
      xAxis: {
        type: 'category', 
        data: ['2025', '2026', '2027', '2028', '2029', '2030'],
        axisLine: { lineStyle: { color: '#FFD700' } },
        axisLabel: { color: '#FFE4B5' }
      },
      yAxis: {
        type: 'value', 
        name: '发掘数量', 
        nameTextStyle: { color: '#FFE4B5' },
        axisLine: { lineStyle: { color: '#FFD700' } },
        axisLabel: { color: '#FFE4B5' }
      },
      series: [
        {
          name: '历史数据', 
          type: 'line', 
          data: [286, null, null, null, null, null],
          lineStyle: { color: '#3b82f6', width: 3 },
          itemStyle: { color: '#3b82f6' },
          symbol: 'circle', 
          symbolSize: 6
        },
        {
          name: '预测数据', 
          type: 'line', 
          data: [286, 310, 335, 362, 390, 420],
          lineStyle: { color: '#10b981', width: 3, type: 'dashed' },
          itemStyle: { color: '#10b981' },
          symbol: 'circle', 
          symbolSize: 6
        }
      ]
    });
  </script>
</body>

</html>

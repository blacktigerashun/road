<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>重点建筑监测详情</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="js/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      color: #fff;
      font-family: sans-serif;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      position: relative;
      padding: 15px;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('../丝绸之路/img/背景2.png') no-repeat center/cover;
      background-attachment: fixed;
      z-index: -1;
      filter: brightness(0.8);
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #FFD700;
      margin-bottom: 12px;
    }

    .head h2 {
      font-size: 24px;
      font-family: "STXingkai", "华文行楷", "方正行楷", "KaiTi", serif;
      background: linear-gradient(135deg, #FFD700, #FFB800, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
    }

    .back {
      color: #FFD700;
      cursor: pointer;
      font-size: 14px;
      background: rgba(139, 69, 19, 0.7);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      transition: all 0.3s ease;
    }

    .back:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: calc(100% - 80px);
    }

    .box {
      background: rgba(139, 69, 19, 0.8);
      border: 1px solid #FFD700;
      border-radius: 8px;
      padding: 15px;
      position: relative;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .box::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      border: 1px solid rgba(255, 215, 0, 0.1);
      border-radius: 6px;
      pointer-events: none;
    }

    .title {
      font-size: 15px;
      color: #FFD700;
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 3px solid #FFD700;
      font-family: "STXingkai", "华文行楷", "方正行楷", "KaiTi", serif;
    }

    .chart {
      height: calc(100% - 30px);
      width: 100%;
    }

    .info-card {
      grid-column: 1/2;
      grid-row: 1/2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      font-size: 14px;
    }

    .info-label {
      color: #FFE4B5;
      width: 80px;
    }

    .info-value {
      color: #FFD700;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="head">
    <h2>重点建筑监测详情</h2>
    <div class="back" onclick="location.href='index.html'">← 返回大屏</div>
  </div>

  <div class="grid">
    <!-- 1. 基础信息卡片 -->
    <div class="box info-card">
      <div class="title">监测数据统计</div>
      <div class="info-item"><span class="info-label">监控总数</span><span class="info-value">152 路</span></div>
      <div class="info-item"><span class="info-label">正常运行</span><span class="info-value">142 路</span></div>
      <div class="info-item"><span class="info-label">预警数量</span><span class="info-value">8 路</span></div>
      <div class="info-item"><span class="info-label">异常数量</span><span class="info-value">2 路</span></div>
      <div class="info-item"><span class="info-label">在线率</span><span class="info-value">93.4%</span></div>
    </div>

    <!-- 2. 时间轴条形图 -->
    <div class="box">
      <div class="title">监测设备运行时长</div>
      <div class="chart" id="b1"></div>
    </div>

    <!-- 3. 情感峰值图 -->
    <div class="box">
      <div class="title">建筑安全预警等级</div>
      <div class="chart" id="b2"></div>
    </div>

    <!-- 4. 复合环形图 -->
    <div class="box">
      <div class="title">监测建筑类型分布</div>
      <div class="chart" id="b3"></div>
    </div>

    <!-- 5. 波动折线图 -->
    <div class="box">
      <div class="title">近30天预警次数趋势</div>
      <div class="chart" id="b4"></div>
    </div>

    <!-- 6. 多层环形图 -->
    <div class="box">
      <div class="title">异常类型占比</div>
      <div class="chart" id="b5"></div>
    </div>
  </div>

  <script>
    // 1. 时间轴条形图
    echarts.init(document.getElementById('b1')).setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '10%', right: '5%', top: '15%', bottom: '15%' },
      xAxis: { type: 'value', name: '运行时长(天)', nameTextStyle: { color: '#FFE4B5' }, axisLine: { lineStyle: { color: '#FFD700' } }, axisLabel: { color: '#FFE4B5' } },
      yAxis: { type: 'category', data: ['关隘', '城池', '烽燧', '驿站'], axisLine: { lineStyle: { color: '#FFD700' } }, axisLabel: { color: '#FFE4B5' } },
      series: [{ 
        name: '运行时长', 
        type: 'bar', 
        barWidth: 20, 
        data: [365, 358, 342, 328], 
        itemStyle: { 
          color: function(params) {
            var colors = ['#3b82f6', '#10b981', '#f472b6', '#fb923c'];
            return colors[params.dataIndex];
          }
        }, 
        label: { show: true, position: 'right', color: '#FFE4B5' } 
      }]
    });

    // 2. 情感峰值图
    echarts.init(document.getElementById('b2')).setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '10%', right: '5%', top: '15%', bottom: '15%' },
      xAxis: { type: 'category', data: ['无预警', '一级', '二级', '三级', '四级'], axisLine: { lineStyle: { color: '#FFD700' } }, axisLabel: { color: '#FFE4B5' } },
      yAxis: { type: 'value', name: '建筑数量', nameTextStyle: { color: '#FFE4B5' }, axisLine: { lineStyle: { color: '#FFD700' } }, axisLabel: { color: '#FFE4B5' } },
      series: [
        { name: '关隘', type: 'bar', barWidth: 15, data: [35, 2, 1, 0, 0], itemStyle: { color: '#3b82f6' } },
        { name: '城池', type: 'bar', barWidth: 15, data: [48, 3, 1, 1, 0], itemStyle: { color: '#10b981' } },
        { name: '烽燧', type: 'bar', barWidth: 15, data: [26, 2, 0, 0, 0], itemStyle: { color: '#f472b6' } }
      ]
    });

    // 3. 复合环形图
    echarts.init(document.getElementById('b3')).setOption({
      tooltip: { trigger: 'item' },
      legend: { orient: 'vertical', right: '5%', top: 'center', textStyle: { color: '#FFE4B5' } },
      series: [
        {
          name: '建筑类型', type: 'pie', radius: ['30%', '50%'], center: ['30%', '50%'],
          data: [{ value: 128, name: '皇宫' }, { value: 432, name: '官府' }, { value: 278, name: '桥梁' }, { value: 1365, name: '民居' }],
          itemStyle: { color: function (params) { var colorList = ['#3b82f6', '#10b981', '#8b5cf6', '#ec4899']; return colorList[params.dataIndex]; } },
          label: { show: true, position: 'inside', color: '#fff' }
        },
        {
          name: '监测状态', type: 'pie', radius: ['60%', '80%'], center: ['30%', '50%'],
          data: [{ value: 93, name: '正常' }, { value: 5, name: '预警' }, { value: 2, name: '异常' }],
          label: { show: true, position: 'inside', color: '#fff' }
        }
      ]
    });

    // 4. 波动折线图
    echarts.init(document.getElementById('b4')).setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '10%', right: '5%', top: '15%', bottom: '15%' },
      xAxis: { type: 'category', data: ['第1周', '第2周', '第3周', '第4周'], axisLine: { lineStyle: { color: '#FFD700' } }, axisLabel: { color: '#FFE4B5' } },
      yAxis: { type: 'value', name: '预警次数', nameTextStyle: { color: '#FFE4B5' }, axisLine: { lineStyle: { color: '#FFD700' } }, axisLabel: { color: '#FFE4B5' } },
      series: [
        { name: '环境预警', type: 'line', smooth: true, data: [5, 8, 6, 9], lineStyle: { color: '#3b82f6', width: 3 }, itemStyle: { color: '#3b82f6' }, symbol: 'circle', symbolSize: 6 },
        { name: '结构预警', type: 'line', smooth: true, data: [2, 3, 1, 2], lineStyle: { color: '#ec4899', width: 3 }, itemStyle: { color: '#ec4899' }, symbol: 'circle', symbolSize: 6 }
      ]
    });

    // 5. 多层环形图
    echarts.init(document.getElementById('b5')).setOption({
      tooltip: { trigger: 'item' },
      series: [
        { type: 'pie', radius: ['0%', '20%'], center: ['50%', '50%'], label: { show: false }, itemStyle: { color: '#8B4513' } },
        {
          type: 'pie', radius: ['25%', '40%'], center: ['50%', '50%'],
          data: [
            { value: 57, name: '温湿度异常', itemStyle: { color: '#ef4444' } },
            { value: 20, name: '震动异常', itemStyle: { color: '#f97316' } },
            { value: 15, name: '位移异常', itemStyle: { color: '#3b82f6' } },
            { value: 5, name: '供电异常', itemStyle: { color: '#8b5cf6' } },
            { value: 2, name: '网络异常', itemStyle: { color: '#10b981' } },
            { value: 1, name: '其他异常', itemStyle: { color: '#06b6d4' } }
          ],
          label: { show: true, position: 'outside', formatter: '{b}: {c}%', color: '#FFE4B5' },
          labelLine: { show: true, lineStyle: { color: '#FFD700' } }
        },
        { type: 'pie', radius: ['45%', '60%'], center: ['50%', '50%'], label: { show: false }, itemStyle: { color: 'rgba(255,215,0,0.2)' } }
      ]
    });
  </script>
</body>

</html>

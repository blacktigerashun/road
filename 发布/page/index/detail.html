<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>文章详情 - 中国古代建筑</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #000d4a;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .back-section {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 20px;
      background: rgba(26, 185, 139, 0.1);
      border: 1px solid rgba(26, 185, 139, 0.3);
      border-radius: 4px;
      color: #46b8ff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .back-btn:hover {
      background: rgba(26, 185, 139, 0.2);
      color: #fff;
    }

    .article-detail {
      max-width: 800px;
      margin: 20px auto;
      padding: 30px;
      background: rgba(0, 13, 74, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      border: 2px solid rgba(26, 185, 139, 0.3);
    }

    .article-title {
      font-size: 24px;
      font-weight: 600;
      color: #46b8ff;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(26, 185, 139, 0.3);
      text-align: center;
      letter-spacing: 4px;
    }

    .article-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      font-size: 14px;
      color: #ccc;
    }

    .meta-item {
      display: flex;
      align-items: center;
    }

    .meta-item svg {
      width: 16px;
      height: 16px;
      margin-right: 6px;
      fill: #46b8ff;
    }

    .article-content {
      font-size: 16px;
      line-height: 1.8;
      color: #fff;
      margin-bottom: 30px;
    }

    .article-content p { margin-bottom: 16px; }

    .article-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 20px 0;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      color: #46b8ff;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      padding: 60px 0;
      color: #46b8ff;
      font-size: 16px;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: rgba(0, 13, 74, 0.95);
      border-top: 2px solid rgba(26, 185, 139, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
      color: #ccc;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .tab-item:hover { background: rgba(26, 185, 139, 0.1); }

    .tab-item.active {
      color: #46b8ff;
      background: rgba(26, 185, 139, 0.1);
    }

    .tab-item svg {
      width: 28px;
      height: 28px;
      margin-bottom: 6px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="back-section">
    <a href="../index/index.html" class="back-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" style="margin-right: 8px; fill: currentColor;">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
      </svg>
      返回列表
    </a>
  </div>

  <div class="article-detail" id="articleDetail">
    <div class="loading" id="loading">加载中...</div>
    <div class="empty" id="empty" style="display: none;">
      <div>文章不存在或已被删除</div>
    </div>
  </div>

  <div class="tab-bar">
    <a href="../index/index.html" class="tab-item active">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span>首页</span>
    </a>
    <a href="../content/index.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"></path></svg>
      <span>文章管理</span>
    </a>
    <a href="../publish/index.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>
      <span>发布文章</span>
    </a>
  </div>

  <script>
    function getArticleId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function loadArticlesFromStorage() {
      const storedArticles = localStorage.getItem('articles');
      return storedArticles ? JSON.parse(storedArticles) : [];
    }

    function loadArticleDetail() {
      const articleId = getArticleId();
      if (!articleId) {
        showEmpty();
        return;
      }

      try {
        const articles = loadArticlesFromStorage();
        const article = articles.find(item => item.id == articleId);

        if (article) {
          article.views = (article.views || 0) + 1;
          localStorage.setItem('articles', JSON.stringify(articles));
          renderArticleDetail(article);
        } else {
          showEmpty();
        }
      } catch (error) {
        console.error('加载文章详情失败:', error);
        showEmpty();
      }
    }

    function renderArticleDetail(article) {
      const articleDetail = document.getElementById('articleDetail');
      const loading = document.getElementById('loading');
      const empty = document.getElementById('empty');

      loading.style.display = 'none';
      empty.style.display = 'none';

      const categoryMap = {
        '1': '丝绸之路上的皇宫建筑',
        '2': '丝绸之路上的官府建筑',
        '3': '丝绸之路上的桥梁建筑',
        '4': '丝绸之路上的民居建筑'
      };
      const categoryName = categoryMap[article.category] || '未分类';
      const createTime = article.createTime ? new Date(article.createTime).toLocaleString() : '未知时间';

      articleDetail.innerHTML = `
        <h1 class="article-title">${article.title}</h1>
        <div class="article-meta">
          <div class="meta-item">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path></svg>
            <span>${article.views || 0} 阅读</span>
          </div>
          <div class="meta-item">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.85-1.26l3.03-7.08c.09-.23.12-.47.12-.66v-2z"></path></svg>
            <span>${article.likes || 0} 点赞</span>
          </div>
          <div class="meta-item">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2z"></path></svg>
            <span>${article.comments || 0} 评论</span>
          </div>
          <div class="meta-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"></path></svg>
            <span>${createTime}</span>
          </div>
        </div>
        <div class="article-content">
          ${article.content || '<p>暂无内容</p>'}
        </div>
      `;
    }

    function showEmpty() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', loadArticleDetail);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>论坛 - 文章管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "STKaiti", "KaiTi", serif;
      background: url('../../../丝绸之路/img/背景2.png') no-repeat center/cover fixed;
      background-size: cover;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 69, 19, 0.7);
      z-index: -1;
    }

    .alert-box {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 4px;
      background: rgba(139, 69, 19, 0.9);
      border: 1px solid rgba(255, 215, 0, 0.3);
      z-index: 9999;
      display: none;
      color: #FFD700;
    }

    .alert-success { border-left: 4px solid #10b981; }
    .alert-error { border-left: 4px solid #ef4444; }

    .back-section {
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 20px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
      color: #FFD700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .back-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    .search-bar {
      position: sticky;
      top: 0;
      z-index: 99;
      background: rgba(139, 69, 19, 0.9);
      padding: 16px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
    }

    .search-input {
      flex: 1;
      height: 44px;
      padding: 0 16px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-right: none;
      border-radius: 6px 0 0 6px;
      font-size: 16px;
      outline: none;
      background: rgba(0, 0, 0, 0.3);
      color: #FFE4B5;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .search-input:focus {
      border-color: #FFD700;
    }

    .search-input::placeholder { color: #D2B48C; }

    .search-btn {
      height: 44px;
      width: 100px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #FFD700;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      font-size: 16px;
      color: #FFD700;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .search-btn:hover {
      background: rgba(255, 215, 0, 0.4);
      color: #fff;
    }

    .main-content {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .content-card {
      background: rgba(139, 69, 19, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 8px;
      border: 2px solid rgba(255, 215, 0, 0.3);
      margin-bottom: 30px;
    }

    .content-card .card-title {
      font-size: 22px;
      font-weight: 600;
      color: #FFD700;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
      text-align: center;
      letter-spacing: 4px;
    }

    .sel-form {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    .sel-form > div { flex: 1; min-width: 150px; }

    .sel-form .form-label {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
      color: #FFD700;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .sel-form .form-select {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      background: rgba(0, 0, 0, 0.3);
      color: #FFE4B5;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .sel-form .form-select:focus { border-color: #FFD700; }

    .sel-form .form-select option { background: #1a1a1a; color: #FFE4B5; }

    .sel-form .sel-btn {
      height: 48px;
      padding: 0 32px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #FFD700;
      border-radius: 6px;
      font-size: 16px;
      color: #FFD700;
      cursor: pointer;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .sel-form .sel-btn:hover {
      background: rgba(255, 215, 0, 0.4);
      color: #fff;
    }

    .content-card .table {
      width: 100%;
      margin-bottom: 30px;
      border-collapse: collapse;
      font-size: 16px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .content-card .table th, .content-card .table td {
      padding: 16px 12px;
      text-align: left;
      color: #FFE4B5;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
    }

    .content-card .table th {
      background: rgba(0, 0, 0, 0.3);
      color: #FFD700;
      font-weight: 600;
    }

    .content-card .table tr:hover td {
      background: rgba(255, 215, 0, 0.1);
    }

    .content-card .table img {
      width: 80px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .badge.text-bg-success { background: #10b981; color: #fff; }
    .badge.text-bg-primary { background: #8B4513; color: #FFD700; }
    .badge.text-bg-warning { background: #f97316; color: #fff; }

    .edit, .del {
      font-size: 20px;
      cursor: pointer;
      margin-right: 20px;
      color: #FFD700;
    }

    .edit:hover, .del:hover { color: #fff; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      list-style: none;
      margin-top: 30px;
    }

    .pagination .page-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
      color: #FFE4B5;
      text-decoration: none;
      font-size: 16px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .pagination .page-link:hover {
      border-color: #FFD700;
      color: #FFD700;
    }

    .pagination .page-link.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination .page-now {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 16px;
      color: #FFD700;
      font-size: 16px;
      font-family: "STKaiti", "KaiTi", serif;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: rgba(139, 69, 19, 0.95);
      border-top: 2px solid rgba(255, 215, 0, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
      color: #D2B48C;
      text-decoration: none;
      font-family: "STKaiti", "KaiTi", serif;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .tab-item:hover { background: rgba(255, 215, 0, 0.1); }

    .tab-item.active {
      color: #FFD700;
      background: rgba(255, 215, 0, 0.1);
    }

    .tab-item svg {
      width: 28px;
      height: 28px;
      margin-bottom: 6px;
      fill: currentColor;
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      color: #FFD700;
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .empty-data {
      text-align: center;
      padding: 60px 0;
      color: #FFD700;
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    @media (max-width: 768px) {
      .table-container { overflow-x: auto; }
      .content-card { padding: 16px; }
      .sel-form { flex-direction: column; align-items: stretch; }
      .sel-form .sel-btn { margin-top: 0; }
    }
  </style>
</head>
<body>
  <div class="alert-box" id="alertBox"></div>

  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索文章标题...">
    <button class="search-btn" id="searchBtn">搜索</button>
  </div>

  <div class="back-section">
    <div class="back-btn-group">
      <a href="../../../index.html" class="back-btn" id="backHomeBtn">返回网站主页</a>
      <a href="javascript:;" class="back-btn" id="refreshBtn">刷新列表</a>
    </div>
  </div>

  <div class="main-content">
    <div class="content-card">
      <div class="card-title">文章管理</div>
      <div class="card-body">
        <form class="sel-form" id="filterForm">
          <div style="display: flex; align-items: center;">
            <label class="form-label" style="margin-right: 10px; margin-bottom: 0;">状态:</label>
            <div class="form-check" style="margin-right: 16px;">
              <input class="form-check-input" type="radio" name="status" value="" id="all" checked>
              <label class="form-check-label" for="all" style="color: #FFE4B5;">全部</label>
            </div>
            <div class="form-check" style="margin-right: 16px;">
              <input class="form-check-input" type="radio" name="status" value="1" id="audit">
              <label class="form-check-label" for="audit" style="color: #FFE4B5;">待审核</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="status" value="2" id="approved">
              <label class="form-check-label" for="approved" style="color: #FFE4B5;">审核通过</label>
            </div>
          </div>
          <div>
            <label class="form-label">分类:</label>
            <select class="form-select" name="channel_id" id="channelSelect">
              <option value="">请选择建筑分类</option>
              <option value="1">丝绸之路上的皇宫建筑</option>
              <option value="2">丝绸之路上的官府建筑</option>
              <option value="3">丝绸之路上的桥梁建筑</option>
              <option value="4">丝绸之路上的民居建筑</option>
            </select>
          </div>
          <div>
            <button type="button" class="btn btn-primary sel-btn" id="filterBtn">筛选</button>
          </div>
        </form>
      </div>
    </div>

    <div class="content-card">
      <div class="table-container">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>封面</th>
              <th>标题</th>
              <th>分类</th>
              <th>状态</th>
              <th>发布时间</th>
              <th>阅读数</th>
              <th>评论数</th>
              <th>点赞数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody class="align-middle art-list" id="articleList">
            <tr class="loading-row">
              <td colspan="9" class="loading">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <nav>
        <ul class="pagination" id="pagination">
          <li class="page-item">
            <a class="page-link" id="prevPage" href="javascript:;">&laquo;</a>
          </li>
          <li class="page-item page-now" id="pageInfo">第1页 / 共0页</li>
          <li class="page-item">
            <a class="page-link" id="nextPage" href="javascript:;">&raquo;</a>
          </li>
          <li>
            <span class="total-count page-now" id="totalCount">共0条</span>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="tab-bar">
    <a href="../index/index.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span>首页</span>
    </a>
    <a href="./index.html" class="tab-item active">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"></path></svg>
      <span>文章管理</span>
    </a>
    <a href="../publish/index.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>
      <span>发布文章</span>
    </a>
  </div>

  <script src="https://unpkg.com/axios@1.6.8/dist/axios.min.js"></script>
  <script src="https://unpkg.com/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../lib/form-serialize.js"></script>
  <script src="../../utils/request.js"></script>
  <script src="../../utils/auth.js"></script>
  <script src="./index.js"></script>
</body>
</html>

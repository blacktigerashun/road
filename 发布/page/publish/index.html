<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>论坛 - 发布文章</title>
  <style>
    :root {
      --primary-color: #8B4513;
      --accent-color: #FFD700;
      --wood-color: #8B4513;
      --light-wood: #D2B48C;
      --bg-color: rgba(139, 69, 19, 0.9);
      --border-color: rgba(255, 215, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "STKaiti", "KaiTi", serif;
      background: url('../../../丝绸之路/img/背景2.png') no-repeat center/cover fixed;
      background-size: cover;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 69, 19, 0.7);
      z-index: -1;
    }

    .publish-back-section {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .publish-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 20px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 4px;
      color: #FFD700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .publish-back-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    .alert {
      width: 400px;
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 10000;
      padding: 12px 20px;
      border-radius: 4px;
      background: rgba(139, 69, 19, 0.9);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #FFD700;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .alert.success { border-left: 4px solid #10b981; }
    .alert.error { border-left: 4px solid #ef4444; }

    .main-content {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .publish-card {
      background: rgba(139, 69, 19, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 8px;
      border: 2px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
    }

    .publish-card .card-title {
      font-size: 22px;
      font-weight: 600;
      color: #FFD700;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
      text-align: center;
      letter-spacing: 4px;
    }

    .art-form .form-group { margin-bottom: 25px; }

    .art-form .form-label {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
      color: #FFD700;
      font-weight: 600;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .art-form .form-select, .art-form .form-control {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      background: rgba(0, 0, 0, 0.3);
      color: #FFE4B5;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .art-form .form-select:focus, .art-form .form-control:focus {
      border-color: #FFD700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .art-form .form-select option {
      background: #1a1a1a;
      color: #FFE4B5;
    }

    .art-form .cover .place {
      display: inline-block;
      width: 150px;
      height: 150px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      text-align: center;
      line-height: 150px;
      font-size: 32px;
      color: #FFD700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .art-form .cover .place:hover {
      background: rgba(255, 215, 0, 0.1);
      border-color: #FFD700;
    }

    .art-form .cover .place::after {
      content: '点击上传封面';
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      font-size: 12px;
      line-height: 1;
      color: #FFD700;
    }

    .art-form .cover img {
      display: none;
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    #editor—wrapper {
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.3);
    }

    #toolbar-container {
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
      padding: 12px 16px;
      border-radius: 8px 8px 0 0;
    }

    #editor-container {
      min-height: 400px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 16px;
      color: #FFE4B5;
      font-family: "STKaiti", "KaiTi", serif;
      border-radius: 0 0 8px 8px;
    }

    .art-form .send {
      width: 100%;
      height: 56px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #FFD700;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: "STKaiti", "KaiTi", serif;
      color: #FFD700;
    }

    .art-form .send:hover {
      background: rgba(255, 215, 0, 0.4);
      color: #fff;
    }

    .art-form .send:disabled {
      background: rgba(100, 100, 100, 0.3);
      cursor: not-allowed;
      border-color: #666;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: rgba(139, 69, 19, 0.95);
      border-top: 2px solid rgba(255, 215, 0, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
      color: #D2B48C;
      text-decoration: none;
      font-family: "STKaiti", "KaiTi", serif;
      transition: all 0.3s;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .tab-item:hover {
      background: rgba(255, 215, 0, 0.1);
    }

    .tab-item.active {
      color: #FFD700;
      background: rgba(255, 215, 0, 0.1);
    }

    .tab-item svg {
      width: 28px;
      height: 28px;
      margin-bottom: 6px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="alert info-box" id="alertBox">操作结果</div>

  <div class="publish-back-section">
    <a href="../index/index.html" class="publish-back-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" style="margin-right: 8px; fill: currentColor;">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
      </svg>
      返回首页
    </a>
  </div>

  <div class="main-content">
    <div class="publish-card">
      <div class="card-title">发布文章</div>
      <div class="card-body">
        <form class="art-form" id="publishForm">
          <div class="form-group">
            <label class="form-label">分类：</label>
            <select class="form-select" name="category">
              <option value="" selected>请选择建筑分类</option>
              <option value="1">丝绸之路上的皇宫建筑</option>
              <option value="2">丝绸之路上的官府建筑</option>
              <option value="3">丝绸之路上的桥梁建筑</option>
              <option value="4">丝绸之路上的民居建筑</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">标题：</label>
            <input type="text" class="form-control" name="title" placeholder="请输入文章标题（2-50个字）">
          </div>

          <div class="form-group cover">
            <label class="form-label">封面：</label>
            <label for="img" class="place">+</label>
            <input type="file" id="img" hidden accept="image/*">
            <img id="coverPreview">
          </div>

          <div class="form-group">
            <label class="form-label">内容：</label>
            <div id="editor—wrapper">
              <div id="toolbar-container"></div>
              <div id="editor-container"></div>
            </div>
          </div>

          <button type="button" class="btn btn-primary send" id="publishBtn">发布</button>
        </form>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <a href="../index/index.html" class="tab-item">
      <svg viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <span>首页</span>
    </a>
    <a href="../content/index.html" class="tab-item">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"></path>
      </svg>
      <span>文章管理</span>
    </a>
    <a href="./index.html" class="tab-item active">
      <svg viewBox="0 0 24 24">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path>
      </svg>
      <span>发布文章</span>
    </a>
  </div>

  <script src="https://unpkg.com/axios@1.6.8/dist/axios.min.js"></script>
  <script src="./index.js"></script>
</body>
</html>

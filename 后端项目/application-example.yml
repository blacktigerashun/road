# ============================================================
# 后端配置模板
# 使用方式：复制本文件为 src/main/resources/application.yml 后填入真实值
# 真实的 application.yml 已被 .gitignore 排除，不会提交到 GitHub
# ============================================================
spring:
  datasource:
    # 示例：MySQL 连接地址（本地或云端均可）
    url: jdbc:mysql://127.0.0.1:3306/railway?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 你的Redis密码
      database: 0

    jackson:
      default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  type-aliases-package: com.example.buildingplatform.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

server:
  port: 8087

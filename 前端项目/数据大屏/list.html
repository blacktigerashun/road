<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>丝绸之路古代建筑 - 清单列表</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="js/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      color: #fff;
      font-family: "STKaiti", "KaiTi", serif;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      position: relative;
      padding: 15px;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('../丝绸之路/img/背景2.png') no-repeat center/cover;
      background-attachment: fixed;
      z-index: -1;
      filter: brightness(0.8);
    }

    /* 头部样式 */
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #FFD700;
      margin-bottom: 12px;
    }

    .head h2 {
      font-size: 24px;
      font-family: "STXingkai", "华文行楷", "方正行楷", "KaiTi", serif;
      background: linear-gradient(135deg, #FFD700, #FFB800, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
    }

    .back {
      color: #FFD700;
      cursor: pointer;
      font-size: 14px;
      background: rgba(139, 69, 19, 0.7);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      transition: all 0.3s ease;
    }

    .back:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    /* 模块样式 - 古建筑风格 */
    .box {
      background: rgba(139, 69, 19, 0.8);
      border: 1px solid #FFD700;
      border-radius: 8px;
      padding: 15px;
      position: relative;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
      margin-bottom: 12px;
    }

    .box::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      border: 1px solid rgba(255, 215, 0, 0.1);
      border-radius: 6px;
      pointer-events: none;
    }

    /* 标题样式 */
    .title {
      font-size: 15px;
      color: #FFD700;
      margin-bottom: 15px;
      padding-left: 8px;
      border-left: 3px solid #FFD700;
      font-family: "STXingkai", "华文行楷", "方正行楷", "KaiTi", serif;
    }

    /* 筛选区样式 */
    .filter-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    select, .search-box input {
      padding: 6px 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 4px;
      background-color: rgba(139, 69, 19, 0.5);
      color: #FFD700;
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    select option {
      background-color: #8B4513;
      color: #FFD700;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
    }

    .search-box input {
      width: 200px;
    }

    .search-box button {
      padding: 6px 12px;
      background: rgba(139, 69, 19, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 4px;
      color: #FFD700;
      cursor: pointer;
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
      transition: all 0.3s ease;
    }

    .search-box button:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    /* 表格样式 */
    .table-container {
      max-height: calc(100% - 200px);
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    th {
      background-color: rgba(139, 69, 19, 0.5);
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
      color: #FFD700;
      font-family: "STXingkai", "华文行楷", "方正行楷", "KaiTi", serif;
    }

    td {
      color: #FFE4B5;
    }

    /* 分页控制 */
    .pagination {
      text-align: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 215, 0, 0.1);
    }

    .pagination button {
      background: rgba(139, 69, 19, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 4px;
      color: #FFD700;
      padding: 6px 12px;
      margin: 0 5px;
      cursor: pointer;
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
      transition: all 0.3s ease;
    }

    .pagination button:hover, .pagination button.active {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
      border-color: #FFD700;
    }

    /* 按钮样式 */
    .btn {
      background: rgba(139, 69, 19, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 4px;
      color: #FFD700;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      font-family: "STKaiti", "KaiTi", serif;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    /* 模态框样式 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(139, 69, 19, 0.8);
    }

    .modal-content {
      background: rgba(139, 69, 19, 0.9);
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #FFD700;
      border-radius: 8px;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
    }

    .modal-title {
      color: #FFD700;
      font-size: 18px;
      font-weight: bold;
      font-family: "STXingkai", "华文行楷", "方正行楷", "KaiTi", serif;
    }

    .close {
      color: #FFD700;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }

    .modal-body {
      margin-bottom: 15px;
      line-height: 1.5;
      color: #FFE4B5;
    }

    .modal-body strong {
      color: #FFD700;
    }

    .modal-footer {
      text-align: right;
    }

    /* 响应式设计 */
    @media (max-width: 1200px) {
      .filter-container {
        flex-direction: column;
        align-items: flex-start;
      }

      select,
      .search-box {
        width: 100%;
      }

      .search-box input {
        flex: 1;
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        min-width: 800px;
      }
    }
  </style>
</head>

<body>
  <div class="head">

          </tr>
        </thead>

    <div class="pagination" id="pagination">

  <!-- 模态框 -->
  <div id="myModal" class="modal">

      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>

      </div>

        <button class="btn" onclick="closeModal()">关闭</button>

    </div>

  <script>
    // 完整建筑数据 - 丝绸之路上的中国古代建筑
    const data = [

      { id: 3, name: "兴庆宫", type: "皇宫", area: "陕西", level: "省级文物保护单位", description: "兴庆宫是唐玄宗时期的宫殿，是唐代三大宫殿之一。始建于开元二年（714年），原为唐玄宗即位前的藩邸，后扩建为宫苑，是唐代皇室的重要活动场所。" },
      { id: 4, name: "阿房宫遗址", type: "皇宫", area: "陕西", level: "国家级文保单位", description: "阿房宫是秦代的宫殿建筑群，始建于秦始皇三十五年（前212年），是中国历史上规模宏大的宫殿之一，与长城、秦始皇陵并称为秦始皇的三大工程。" },

    const itemsPerPage = 10; // 每页显示10条数据

    // 渲染表格
    function render(list) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      if (list.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6'>暂无匹配数据</td></tr>";
        return;
      }

      // 计算分页数据
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedList = list.slice(startIndex, endIndex);

      paginatedList.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.name}</td>
          <td>${item.type}</td>
          <td>${item.area}</td>
          <td>${item.level}</td>
          <td><button onclick="showDetails(${item.id})" class="btn">查看简介</button></td>
        `;
        tbody.appendChild(tr);
      });

      // 更新分页按钮状态
      updatePaginationButtons(list.length);
    }

    // 更新分页按钮状态
    function updatePaginationButtons(totalItems) {
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      
      // 显示或隐藏分页按钮
      document.getElementById('page1').style.display = totalPages >= 1 ? 'inline-block' : 'none';
      document.getElementById('page2').style.display = totalPages >= 2 ? 'inline-block' : 'none';
      document.getElementById('page3').style.display = totalPages >= 3 ? 'inline-block' : 'none';
      
      // 更新按钮样式
      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`page${i}`);
        if (btn) {
          if (i === currentPage) {
            btn.classList.add('active');
            btn.style.backgroundColor = 'rgba(255, 215, 0, 0.2)';
            btn.style.color = '#fff';
            btn.style.borderColor = '#FFD700';
          } else {
            btn.classList.remove('active');
            btn.style.backgroundColor = 'rgba(139, 69, 19, 0.7)';
            btn.style.color = '#FFD700';
            btn.style.borderColor = 'rgba(255, 215, 0, 0.3)';
          }
        }
      }
    }

    // 切换分页
    function changePage(page) {
      currentPage = page;
      search(); // 重新搜索并渲染当前页
    }

    // 搜索筛选核心函数
    function search() {
      const area = document.getElementById("selArea").value;
      const type = document.getElementById("selType").value;
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();

      let result = [...data];

      // 地区筛选
      if (area !== "all") {
        result = result.filter(i => i.area === area);
      }

      // 类别筛选
      if (type !== "all") {
        result = result.filter(i => i.type === type);
      }

      // 关键词搜索
      if (keyword) {
        result = result.filter(i =>
          i.name.toLowerCase().includes(keyword) ||
          i.area.toLowerCase().includes(keyword) ||
          i.type.toLowerCase().includes(keyword)
        );
      }

      render(result);
    }

    // 显示建筑详情
    function showDetails(id) {
      const building = data.find(item => item.id === id);
      if (building) {
        document.getElementById("modalTitle").textContent = building.name;
        
        // 未央宫遗址弹窗增加跳转按钮
        const jumpButton = building.name === "未央宫遗址" 
          ? '<button class="btn" style="margin-top: 10px; display: block; margin-left: auto; margin-right: auto; background: rgba(255, 215, 0, 0.2); border-color: #FFD700; color: #FFD700;" onclick="location.href=\'未央宫遗址/index.html\'">查看详细数据大屏</button>' 
          : '';
        
        document.getElementById("modalBody").innerHTML = `
          <p><strong>建筑类别：</strong>${building.type}</p>
          <p><strong>所在地区：</strong>${building.area}</p>
          <p><strong>保护级别：</strong>${building.level}</p>
          <p><strong>简介：</strong>${building.description}</p>
          ${jumpButton}
        `;
        document.getElementById("myModal").style.display = "block";
      }
    }

    // 关闭模态框
    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }

    // 点击模态框外部关闭
    window.onclick = function(event) {
      const modal = document.getElementById("myModal");
      if (event.target === modal) {
        closeModal();
      }
    }

    // 初始化
    window.onload = function () {
      render(data);
      
      // 添加筛选事件监听器
      document.getElementById("selArea").addEventListener("change", search);
      document.getElementById("selType").addEventListener("change", search);
    }
  </script>
</body>

</html>

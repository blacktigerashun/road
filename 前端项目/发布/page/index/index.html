<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>论坛 - 首页</title>
  <style>
    :root {
      --primary-color: #8B4513;
      --accent-color: #FFD700;
      --border-color: rgba(255, 215, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "STKaiti", "KaiTi", serif;
      background: url('../../../丝绸之路/img/背景2.png') no-repeat center/cover fixed;
      background-size: cover;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 69, 19, 0.7);
      z-index: -1;
    }

    .home-back-section {
      max-width: 100%;
      padding: 10px 16px;
      background: rgba(139, 69, 19, 0.9);
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    }

    .home-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 16px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 4px;
      color: #FFD700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .home-back-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    .search-bar {
      position: sticky;
      top: 0;
      z-index: 99;
      background: rgba(139, 69, 19, 0.9);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
    }

    .search-input {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-right: none;
      border-radius: 4px 0 0 4px;
      font-size: 14px;
      outline: none;
      background: rgba(0, 0, 0, 0.3);
      color: #FFE4B5;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .search-input:focus { border-color: #FFD700; }
    .search-input::placeholder { color: #D2B48C; }

    .search-btn {
      height: 36px;
      width: 80px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #FFD700;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-size: 14px;
      color: #FFD700;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .search-btn:hover {
      background: rgba(255, 215, 0, 0.4);
      color: #fff;
    }

    .add-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #FFD700;
      color: #FFD700;
      font-size: 20px;
      margin-left: 12px;
      cursor: pointer;
    }

    .add-btn:hover {
      background: rgba(255, 215, 0, 0.4);
      color: #fff;
    }

    .article-list { padding: 16px; }

    .article-item {
      background: rgba(139, 69, 19, 0.8);
      backdrop-filter: blur(10px);
      padding: 20px 16px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      cursor: pointer;
    }

    .article-item:hover {
      border-color: #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    .article-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #FFD700;
      border-bottom: 1px dashed rgba(255, 215, 0, 0.3);
      padding-bottom: 4px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .article-desc {
      font-size: 13px;
      color: #FFE4B5;
      line-height: 1.6;
      margin-bottom: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .article-meta {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #D2B48C;
      border-top: 1px dashed rgba(255, 215, 0, 0.3);
      padding-top: 8px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      margin-right: 20px;
    }

    .meta-item svg {
      width: 14px;
      height: 14px;
      margin-right: 4px;
      fill: #FFD700;
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: rgba(139, 69, 19, 0.95);
      border-top: 2px solid rgba(255, 215, 0, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      color: #D2B48C;
      text-decoration: none;
      font-family: "STKaiti", "KaiTi", serif;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .tab-item:hover { background: rgba(255, 215, 0, 0.1); }

    .tab-item.active {
      color: #FFD700;
      background: rgba(255, 215, 0, 0.1);
    }

    .tab-item svg {
      width: 24px;
      height: 24px;
      margin-bottom: 4px;
      fill: currentColor;
    }

    .loading {
      text-align: center;
      padding: 16px;
      font-size: 14px;
      color: #FFD700;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .empty-data {
      text-align: center;
      padding: 40px 20px;
      color: #FFD700;
      font-size: 14px;
      font-family: "STKaiti", "KaiTi", serif;
    }
  </style>
</head>
<body>
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="搜索文章标题...">
    <button class="search-btn">搜索</button>
    <button class="add-btn" onclick="location.href='../publish/index.html'">+</button>
  </div>

  <div class="home-back-section">
    <a href="../../page/login/login.html" class="home-back-btn" id="backHomeBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" style="margin-right: 6px; fill: currentColor;">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
      </svg>
      返回网站主页
    </a>
  </div>

  <div class="article-list" id="articleList"></div>
  <div class="loading" id="loading">加载中...</div>
  <div class="empty-data" id="emptyData" style="display: none;">暂无相关文章</div>

  <div class="tab-bar">
    <a href="./index.html" class="tab-item active">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span>首页</span>
    </a>
    <a href="../content/index.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"></path></svg>
      <span>文章管理</span>
    </a>
    <a href="../publish/index.html" class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>
      <span>发布文章</span>
    </a>
  </div>

  <script>
    let isLoading = false;
    let searchKeyword = '';

    const articleList = document.getElementById('articleList');
    const loading = document.getElementById('loading');
    const emptyData = document.getElementById('emptyData');
    const searchInput = document.querySelector('.search-input');
    const searchBtn = document.querySelector('.search-btn');

    function loadArticlesFromStorage() {
      const storedArticles = localStorage.getItem('articles');
      if (storedArticles) {
        return JSON.parse(storedArticles);
      } else {
        const defaultArticles = [
          {
            id: Date.now().toString() + '1',
            category: '1',
            title: '丝绸之路上的古城皇宫建筑',
            content: '丝绸之路上的皇宫建筑融合了中西方建筑风格，以其宏伟的规模和精美的装饰而闻名。这些皇宫不仅是权力的象征，也是文化交流的重要场所。',
            cover: '',
            createTime: new Date().toISOString(),
            views: 100,
            comments: 10,
            likes: 20
          },
          {
            id: Date.now().toString() + '2',
            category: '2',
            title: '丝绸之路沿线的官府建筑特色',
            content: '丝绸之路上的官府建筑通常采用对称布局，体现了中国传统的建筑理念。这些建筑不仅是行政中心，也是文化传承的重要载体。',
            cover: '',
            createTime: new Date().toISOString(),
            views: 150,
            comments: 15,
            likes: 25
          },
          {
            id: Date.now().toString() + '3',
            category: '3',
            title: '丝绸之路上的古桥梁建筑',
            content: '丝绸之路上的桥梁建筑是古代交通的重要组成部分，它们不仅解决了交通问题，也展示了古代工匠的智慧和技艺。',
            cover: '',
            createTime: new Date().toISOString(),
            views: 200,
            comments: 20,
            likes: 30
          },
          {
            id: Date.now().toString() + '4',
            category: '4',
            title: '丝绸之路上的传统民居建筑',
            content: '丝绸之路上的民居建筑因地制宜，融合了不同地区的建筑特色，反映了当地的生活方式和文化传统。',
            cover: '',
            createTime: new Date().toISOString(),
            views: 250,
            comments: 25,
            likes: 35
          }
        ];
        localStorage.setItem('articles', JSON.stringify(defaultArticles));
        return defaultArticles;
      }
    }

    function loadData() {
      if (isLoading) return;
      isLoading = true;
      loading.style.display = 'block';
      emptyData.style.display = 'none';

      try {
        const articles = loadArticlesFromStorage();
        if (articles && articles.length > 0) {
          let filteredArticles = articles;
          if (searchKeyword) {
            filteredArticles = articles.filter(item =>
              item.title.includes(searchKeyword) || item.content.includes(searchKeyword)
            );
          }
          renderArticles(filteredArticles);
        } else {
          renderEmpty();
        }
      } catch (err) {
        console.error('加载失败:', err);
        loading.textContent = '加载失败，点击重试';
        loading.style.cursor = 'pointer';
        loading.onclick = () => {
          loading.textContent = '加载中...';
          loading.style.cursor = 'default';
          loadData();
        };
      } finally {
        isLoading = false;
      }
    }

    function renderArticles(data) {
      articleList.innerHTML = '';
      data.sort((a, b) => new Date(b.createTime) - new Date(a.createTime));

      data.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'article-item';

        const title = item.title || '无标题';
        const content = item.content || '';
        const desc = content.replace(/<[^>]*>/g, '').substring(0, 100) + '...';
        const views = item.views || 0;
        const likes = item.likes || 0;
        const comments = item.comments || 0;

        itemDiv.innerHTML = `
          <div class="article-title">${escapeHtml(title)}</div>
          <div class="article-desc">${escapeHtml(desc)}</div>
          <div class="article-meta">
            <div class="meta-item">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"></path></svg>
              <span>${views}</span>
            </div>
            <div class="meta-item">
              <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.85-1.26l3.03-7.08c.09-.23.12-.47.12-.66v-2z"></path></svg>
              <span>${likes}</span>
            </div>
            <div class="meta-item">
              <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2z"></path></svg>
              <span>${comments}</span>
            </div>
          </div>
        `;

        itemDiv.addEventListener('click', () => {
          if (item.id) {
            window.location.href = `./detail.html?id=${item.id}`;
          }
        });

        articleList.appendChild(itemDiv);
      });

      loading.style.display = 'none';
    }

    function renderEmpty() {
      articleList.innerHTML = '';
      emptyData.style.display = 'block';
      loading.style.display = 'none';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    searchBtn.addEventListener('click', () => {
      searchKeyword = searchInput.value.trim();
      loadData();
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchBtn.click();
    });

    loadData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>丝绸之路建筑论坛 - 登录</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    .back-btn-top {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(139, 69, 19, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #FFD700;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: "STKaiti", "KaiTi", serif;
      transition: all 0.3s;
      text-decoration: none;
    }

    .back-btn-top:hover {
      background: rgba(255, 215, 0, 0.2);
      color: #fff;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(139, 69, 19, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 50px 45px;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
      border: 2px solid rgba(255, 215, 0, 0.3);
      position: relative;
      z-index: 10;
    }

    .login-card:before, .login-card:after {
      position: absolute;
      width: 25px;
      height: 25px;
      content: "";
      border-top: 2px solid #FFD700;
      top: 0;
    }

    .login-card:before {
      border-left: 2px solid #FFD700;
      left: 0;
    }

    .login-card:after {
      border-right: 2px solid #FFD700;
      right: 0;
    }

    .login-card .card-footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      left: 0;
    }

    .login-card .card-footer:before, .login-card .card-footer:after {
      position: absolute;
      width: 25px;
      height: 25px;
      content: "";
      border-bottom: 2px solid #FFD700;
      bottom: 0;
    }

    .login-card .card-footer:before {
      border-left: 2px solid #FFD700;
      left: 0;
    }

    .login-card .card-footer:after {
      border-right: 2px solid #FFD700;
      right: 0;
    }

    .login-card h3 {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #46b8ff;
      margin-bottom: 35px;
      font-family: "STKaiti", "KaiTi", serif;
      text-shadow: 0 0 10px rgba(70, 184, 255, 0.5);
      letter-spacing: 4px;
    }

    .form-label {
      font-size: 15px;
      color: #46b8ff;
      margin-bottom: 8px;
      display: block;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .form-control {
      width: 100%;
      padding: 1rem 1.2rem;
      border: 1px solid rgba(25, 186, 139, 0.17);
      border-radius: 4px;
      font-size: 1.1rem;
      outline: none;
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-family: "STKaiti", "KaiTi", serif;
    }

    .form-control:focus {
      border-color: #02a6b5;
      box-shadow: 0 0 5px rgba(2, 166, 181, 0.5);
    }

    .form-control::placeholder {
      color: #999;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-group button {
      flex: 1;
    }

    .alert {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 30px;
      border-radius: 4px;
      z-index: 9999;
      display: none;
      background: rgba(0, 13, 74, 0.9);
      border: 1px solid rgba(25, 186, 139, 0.17);
      color: #46b8ff;
      box-shadow: 0 0 15px rgba(2, 166, 181, 0.3);
    }

    .alert.show {
      display: block;
    }

    .d-flex {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .mb-3 {
      margin-bottom: 20px;
    }

    .code-box {
      margin-top: 8px;
      padding: 10px;
      background: rgba(25, 186, 139, 0.1);
      border: 1px solid rgba(25, 186, 139, 0.17);
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      color: #46b8ff;
      display: none;
    }

    .code-box.show {
      display: block;
    }

    .btn {
      background: rgba(101, 132, 226, 0.1);
      border: 1px solid rgba(25, 186, 139, 0.17);
      color: #46b8ff;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: "STKaiti", "KaiTi", serif;
      transition: all 0.3s;
    }

    .btn:hover {
      background: rgba(25, 186, 139, 0.2);
      color: #fff;
    }

    .admin-tip {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #FFD700;
      opacity: 0.85;
      font-family: "STKaiti", "KaiTi", serif;
    }

    @media (max-width: 768px) {
      .login-card {
        width: 90%;
        padding: 30px 25px;
      }
      .login-card h3 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <video id="bgVideo" autoplay loop muted>
    <source src="./img/背景2.mp4" type="video/mp4">
  </video>

  <button class="back-btn-top" id="back-top">返回首页</button>

  <div class="alert" id="msg"></div>

  <div class="login-card">
    <h3>丝绸之路建筑论坛</h3>

    <div class="mb-3">
      <label class="form-label">手机号码</label>
      <input class="form-control" id="phone" placeholder="请输入11位手机号码">
    </div>

    <div class="mb-3">
      <label class="form-label">验证码</label>
      <div class="d-flex">
        <input class="form-control" id="code" placeholder="请输入6位验证码">
        <button class="btn" id="getCode">获取验证码</button>
      </div>
      <div class="code-box" id="codeText">后端验证码：</div>
    </div>

    <div class="btn-group">
      <button class="btn" id="login">登 录</button>
    </div>

    <p class="admin-tip">管理员免后端账号：admin / 123456</p>

    <div class="card-footer"></div>
  </div>

  <script>
    const BASE_URL = "http://localhost:8087";

    // 免后端管理员账号（纯前端校验，无需启动后端即可登录）
    const ADMIN_ACCOUNT = "admin";
    const ADMIN_PASS = "123456";

    function showAlert(msg, isSuccess = true) {
      const el = document.getElementById("msg");
      el.innerText = msg;
      el.className = "alert " + (isSuccess ? "alert-success" : "alert-danger");
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2000);
    }

    async function request(url, data) {
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        return await res.json();
      } catch (err) {
        console.error(err);
        return { success: false, message: "后端未启动/跨域拦截" };
      }
    }

    document.getElementById("back-top").onclick = () => {
      location.href = "../../../数据大屏/index.html";
    };

    document.getElementById("getCode").onclick = async function () {
      const phone = document.getElementById("phone").value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showAlert("请输入正确手机号", false);
        return;
      }

      const btn = this;
      btn.disabled = true;
      btn.innerText = "发送中...";

      const result = await request(BASE_URL + "/user/code", { phone });

      if (result.success) {
        const codeText = document.getElementById("codeText");
        codeText.innerText = "✅ 后端验证码：" + result.code;
        codeText.classList.add("show");

        showAlert("验证码已发送");
        let s = 60;
        const timer = setInterval(() => {
          btn.innerText = s + "秒";
          s--;
          if (s < 0) {
            clearInterval(timer);
            btn.innerText = "获取验证码";
            btn.disabled = false;
          }
        }, 1000);
      } else {
        showAlert(result.message || "获取失败", false);
        btn.disabled = false;
        btn.innerText = "获取验证码";
      }
    };

    document.getElementById("login").onclick = async () => {
      const phone = document.getElementById("phone").value.trim();
      const code = document.getElementById("code").value.trim();

      if (!phone || !code) {
        showAlert("请完整填写", false);
        return;
      }

      // 免后端管理员登录：账号 admin / 验证码 123456，直接进管理发布页
      if (phone === ADMIN_ACCOUNT && code === ADMIN_PASS) {
        localStorage.setItem("forum_admin", "1");
        showAlert("管理员登录成功");
        setTimeout(() => location.href = "../publish/index.html", 1200);
        return;
      }

      const result = await request(BASE_URL + "/user/login", { phone, code });

      if (result.success) {
        showAlert("登录成功");
        localStorage.setItem("token", result.token);
        setTimeout(() => location.href = "../index/index.html", 1200);
      } else {
        showAlert(result.message || "验证码错误", false);
      }
    };
  </script>
</body>

</html>
